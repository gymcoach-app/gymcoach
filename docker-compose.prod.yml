# ============================================================
# GymCoach - Compose PROD
# ============================================================
# Full stack built from source: Next.js + Postgres.
# Meant to sit behind an HTTPS reverse proxy (Nginx, Caddy, Traefik), so the
# app only listens on 127.0.0.1. For the prebuilt image, see
# docker-compose.selfhost.yml instead.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: gymcoach-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Demo mode is build-time (NEXT_PUBLIC_*). Defaults keep a normal
        # self-host build unchanged; the public demo sets these in its .env.
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
    container_name: gymcoach-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      USER_EMAIL: ${USER_EMAIL}
      USER_PASSWORD: ${USER_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-GymCoach}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL}
      CODEX_LB_BASE_URL: ${CODEX_LB_BASE_URL:-http://127.0.0.1:8317/v1}
      CODEX_LB_API_KEY: ${CODEX_LB_API_KEY:-}
      CODEX_LB_MODEL: ${CODEX_LB_MODEL:-gpt-5.6-sol}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MAX_TOKENS: ${OPENAI_COMPATIBLE_MAX_TOKENS:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      NODE_ENV: production
      # Progress-photo files (issue #269): kept on the named volume below so
      # they survive container rebuilds. Back it up alongside the database.
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      # Loopback only: the reverse proxy in front terminates HTTPS.
      # Host port 3010 (3000 is taken on the shared host this file came from).
      - '127.0.0.1:3010:3000'

  # Run-once demo seeder (public demo only): resets the demo account to the
  # rich deterministic dataset (12 weeks of sessions, bodyweight trend, a
  # goal, readiness check-ins). Built from the builder stage, which still has
  # the dev dependencies (tsx) the seed scripts need. Re-running it on every
  # deploy doubles as the cleanup of whatever visitors did to the demo data.
  #   docker compose -f docker-compose.prod.yml --profile demo run --rm seed-demo
  seed-demo:
    profiles: ['demo']
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      USER_EMAIL: ${USER_EMAIL}
      USER_PASSWORD: ${USER_PASSWORD}
    command: >
      sh -c "npx prisma migrate deploy && npm run db:seed && npm run seed:demo"

volumes:
  postgres-data:
  uploads:
