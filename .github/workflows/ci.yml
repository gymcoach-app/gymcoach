name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_DATABASE_URL: postgresql://gymcoach_test:gymcoach_test@localhost:5434/gymcoach_test

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned Postgres from the Actions cache, no service container: a
      # service image pull cannot be retried and the ECR public mirror failed
      # about a quarter of attempts (issue #381).
      - uses: ./.github/actions/start-postgres
        with:
          name: test-db
          port: '5434'
          user: gymcoach_test
          password: gymcoach_test
          db: gymcoach_test
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-build-placeholder-secret-at-least-32-chars

  docker-smoke:
    name: Docker smoke test (production image)
    runs-on: ubuntu-latest
    # The image build alone can take 6-8 minutes on a cold GHA cache since the
    # exercise-media and MCP/i18n dependencies landed; 10 was hit twice.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gymcoach:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create the smoke network
        run: docker network create smoke
      - name: Start Postgres
        uses: ./.github/actions/start-postgres
        with:
          name: smoke-db
          network: smoke
          user: gymcoach
          password: gymcoach
          db: gymcoach
      - name: Start the app (migrate deploy + server, same command as prod compose)
        run: |
          docker run -d --name smoke-app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://gymcoach:gymcoach@smoke-db:5432/gymcoach \
            -e JWT_SECRET=docker-smoke-ci-secret-at-least-32-characters \
            gymcoach:smoke \
            sh -c "node node_modules/prisma/build/index.js migrate deploy && node server.js"
      - name: Probe the image (login page, register, login)
        run: |
          set -u
          base=http://localhost:3000

          # Wait for migrations + server startup, then require GET /login = 200.
          code=000
          for i in $(seq 1 45); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$base/login" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "GET /login never returned 200 (last status: $code)" >&2
            exit 1
          fi
          echo "GET /login -> 200"

          # Create the probe account through the image itself: exercises the
          # bcrypt native binding (hash), Prisma writes, and the JWT signing
          # that issue #127 showed can break only inside the standalone image.
          code=$(curl -s --max-time 30 -o /tmp/register.json -w '%{http_code}' -X POST "$base/api/auth/register" \
            -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","password":"smoke-test-password","displayName":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "POST /api/auth/register -> $code" >&2
            cat /tmp/register.json >&2 || true
            exit 1
          fi
          echo "POST /api/auth/register -> 200"

          # The login probe proper: bcrypt.compare + JWT + DB (the #127 class).
          code=$(curl -s --max-time 30 -o /tmp/login.json -w '%{http_code}' -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","password":"smoke-test-password"}')
          if [ "$code" != "200" ]; then
            echo "POST /api/auth/login -> $code" >&2
            cat /tmp/login.json >&2 || true
            exit 1
          fi
          echo "POST /api/auth/login -> 200"
      - name: Container logs (on failure)
        if: failure()
        run: |
          echo "--- smoke-app logs ---"
          docker logs smoke-app 2>&1 || true
          echo "--- smoke-db logs ---"
          docker logs smoke-db 2>&1 || true

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gymcoach_test:gymcoach_test@localhost:5434/gymcoach_test
      JWT_SECRET: e2e-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      # Pinned Postgres from the Actions cache, no service container: a
      # service image pull cannot be retried and the ECR public mirror failed
      # about a quarter of attempts (issue #381).
      - uses: ./.github/actions/start-postgres
        with:
          name: test-db
          port: '5434'
          user: gymcoach_test
          password: gymcoach_test
          db: gymcoach_test
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
