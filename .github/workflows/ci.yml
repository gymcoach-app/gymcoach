name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_DATABASE_URL: postgresql://gymcoach_test:gymcoach_test@localhost:5434/gymcoach_test

# Runners are pinned to ubuntu-24.04: on ubuntu-26.04 (ubuntu-latest since
# 2026-11-03) an image loaded from the Actions cache reports a different ID, so
# start-postgres refuses the pinned Postgres image.
jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Pinned Postgres from the Actions cache, no service container: a
      # service image pull cannot be retried and the ECR public mirror failed
      # about a quarter of attempts (issue #381).
      - uses: ./.github/actions/start-postgres
        with:
          name: test-db
          port: '5434'
          user: gymcoach_test
          password: gymcoach_test
          db: gymcoach_test
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-build-placeholder-secret-at-least-32-chars

  docker-smoke:
    name: Docker smoke test (production image)
    runs-on: ubuntu-24.04
    # The image build alone can take 6-8 minutes on a cold GHA cache since the
    # exercise-media and MCP/i18n dependencies landed; 10 was hit twice.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gymcoach:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create the smoke network
        run: docker network create smoke
      - name: Start Postgres
        uses: ./.github/actions/start-postgres
        with:
          name: smoke-db
          network: smoke
          user: gymcoach
          password: gymcoach
          db: gymcoach
      # No command: the image's own ENTRYPOINT and CMD run, as in the compose
      # files. The entrypoint applies the migrations, then starts the server;
      # the probe below registers a user, which fails on an unmigrated database.
      - name: Start the app (image defaults - the entrypoint migrates, then the server starts)
        run: |
          # The image's own HEALTHCHECK command runs, only more often than its
          # 30 s default so the health step below does not wait on the clock.
          docker run -d --name smoke-app --network smoke -p 3000:3000 \
            --health-interval 5s \
            -e DATABASE_URL=postgresql://gymcoach:gymcoach@smoke-db:5432/gymcoach \
            -e JWT_SECRET=docker-smoke-ci-secret-at-least-32-characters \
            gymcoach:smoke
      - name: Probe the image (login page, register, login)
        run: |
          set -u
          base=http://localhost:3000

          # Wait for migrations + server startup, then require GET /login = 200.
          code=000
          for i in $(seq 1 45); do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$base/login" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "GET /login never returned 200 (last status: $code)" >&2
            exit 1
          fi
          echo "GET /login -> 200"

          # Create the probe account through the image itself: exercises the
          # bcrypt native binding (hash), Prisma writes, and the JWT signing
          # that issue #127 showed can break only inside the standalone image.
          code=$(curl -s --max-time 30 -o /tmp/register.json -w '%{http_code}' -X POST "$base/api/auth/register" \
            -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","password":"smoke-test-password","displayName":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "POST /api/auth/register -> $code" >&2
            cat /tmp/register.json >&2 || true
            exit 1
          fi
          echo "POST /api/auth/register -> 200"

          # The login probe proper: bcrypt.compare + JWT + DB (the #127 class).
          code=$(curl -s --max-time 30 -o /tmp/login.json -w '%{http_code}' -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            --data '{"email":"smoke@example.com","password":"smoke-test-password"}')
          if [ "$code" != "200" ]; then
            echo "POST /api/auth/login -> $code" >&2
            cat /tmp/login.json >&2 || true
            exit 1
          fi
          echo "POST /api/auth/login -> 200"
      - name: Health endpoint and container healthcheck
        run: |
          set -u
          # Unauthenticated, exact body, nothing else in it.
          code=$(curl -s --max-time 10 -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          body=$(cat /tmp/health.json)
          if [ "$code" != "200" ] || [ "$body" != '{"status":"ok"}' ]; then
            echo "GET /api/health -> $code $body" >&2
            exit 1
          fi
          echo "GET /api/health -> 200 $body"

          # The image HEALTHCHECK (node /app/healthcheck.cjs, no curl in the
          # image) must turn the container healthy.
          status=unknown
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke-app 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "smoke-app never became healthy (last status: $status)" >&2
            docker inspect -f '{{json .State.Health}}' smoke-app >&2 || true
            exit 1
          fi
          echo "smoke-app is healthy"

          # Database gone: 503 with the fixed body, and no detail about why.
          docker stop smoke-db >/dev/null
          code=$(curl -s --max-time 10 -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          body=$(cat /tmp/health.json)
          if [ "$code" != "503" ] || [ "$body" != '{"status":"unavailable"}' ]; then
            echo "GET /api/health without a database -> $code $body" >&2
            exit 1
          fi
          echo "GET /api/health without a database -> 503 $body"
      - name: Container logs (on failure)
        if: failure()
        run: |
          echo "--- smoke-app logs ---"
          docker logs smoke-app 2>&1 || true
          echo "--- smoke-db logs ---"
          docker logs smoke-db 2>&1 || true

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://gymcoach_test:gymcoach_test@localhost:5434/gymcoach_test
      JWT_SECRET: e2e-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      # Pinned Postgres from the Actions cache, no service container: a
      # service image pull cannot be retried and the ECR public mirror failed
      # about a quarter of attempts (issue #381).
      - uses: ./.github/actions/start-postgres
        with:
          name: test-db
          port: '5434'
          user: gymcoach_test
          password: gymcoach_test
          db: gymcoach_test
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
